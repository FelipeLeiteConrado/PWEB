<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operações Básicas</title>
</head>

<body>
    <script>
        // Recebe os dois números do usuário
        let n1 = parseFloat(prompt("Digite o primeiro número:"));
        let n2 = parseFloat(prompt("Digite o segundo número:"));

        // Realiza as operações básicas
        let soma = n1 + n2;
        let subtracao = n1 - n2;
        let produto = n1 * n2;
        let divisao = n1 / n2;
        let resto = n1 % n2;

        // Exibe os resultados na tela com alert
        alert(`Soma: ${soma}
Subtração: ${subtracao}
Produto: ${produto}
Divisão: ${divisao}
Resto da divisão: ${resto}`);
    </script>
</body>

</html>
